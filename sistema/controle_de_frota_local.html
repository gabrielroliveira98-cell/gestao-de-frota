<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Controle de Frota</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* =====================================================================
   TOKENS — os dois temas usam os mesmos componentes; só as variáveis mudam.
   Layout: barra superior com abas (vira sidebar na etapa 3); coluna de até 1180px.
   ===================================================================== */
:root {
  /* Paleta da marca (fonte única dos HEX) */
  --rich-black: #021B1A;
  --dark-green: #032221;
  --bangladesh: #03624C;
  --meadow: #2CC295;
  --caribbean: #00DF81;
  --antiflash: #F1F7F6;
  --pine: #06302B;
  --basil: #0B453A;
  --forest: #095544;
  --frog: #17876D;
  --mint: #2FA98C;
  --stone: #707D7D;
  --pistachio: #AACBC4;
  --branco: #FFFFFF;
  --stone-escuro: #5A6666;      /* aprovado: texto secundário pequeno no tema claro (AA) */
  --ambar-claro: #A15C07;       /* alerta no tema claro */
  --ambar-escuro: #F2B544;      /* alerta no tema escuro */
  --coral-claro: #B42318;       /* crítico no tema claro */
  --coral-escuro: #FF8A7A;      /* crítico no tema escuro */
  --placa-azul: #1F4FA0;        /* faixa da placa Mercosul (objeto real) */

  /* Tema CLARO (padrão) */
  --bg: var(--antiflash);
  --surface: var(--branco);
  --surface-2: color-mix(in srgb, var(--pistachio) 14%, var(--branco));   /* hover, zebra, trilhos */
  --line: var(--pistachio);                                                /* borda de cartões */
  --line-forte: var(--stone);                                              /* borda de campos (≥ 3:1) */
  --fg: var(--rich-black);
  --muted: var(--stone-escuro);
  --muted-2: var(--stone);                                                 /* só texto grande, ícones, desativado */
  --heading: var(--bangladesh);
  --accent: var(--caribbean);                                              /* preenchimento: barras, botões, ícones */
  --accent-text: var(--bangladesh);                                        /* texto e valores em destaque */
  --on-accent: var(--rich-black);
  --foco: var(--frog);
  --sucesso: var(--bangladesh);
  --sucesso-bg: color-mix(in srgb, var(--meadow) 16%, var(--branco));
  --alerta: var(--ambar-claro);
  --alerta-bg: color-mix(in srgb, var(--ambar-escuro) 22%, var(--branco));
  --alerta-fill: color-mix(in srgb, var(--ambar-escuro) 35%, var(--ambar-claro));   /* barras: âmbar com 3:1 sobre o trilho (WCAG 1.4.11) */
  --prev-fill: var(--frog);                                                          /* barra "Preventiva": 3:1 sobre o trilho claro */
  --critico: var(--coral-claro);
  --critico-bg: color-mix(in srgb, var(--coral-escuro) 18%, var(--branco));
  --neutro-bg: color-mix(in srgb, var(--pistachio) 28%, var(--branco));
  --serie-1: var(--bangladesh);
  --serie-2: var(--meadow);
  --serie-3: var(--frog);
  --serie-4: var(--mint);
  --serie-5: var(--caribbean);
  --serie-6: var(--pistachio);
  --placa-fundo: var(--branco);
  --placa-texto: var(--rich-black);
  --placa-borda: var(--stone);
  --sombra-1: 0 1px 2px color-mix(in srgb, var(--rich-black) 6%, transparent), 0 1px 3px color-mix(in srgb, var(--rich-black) 4%, transparent);
  --sombra-2: 0 4px 16px color-mix(in srgb, var(--rich-black) 10%, transparent);

  /* Tipografia */
  --font-ui: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --fs-titulo: 24px;   --fw-titulo: 700;
  --fs-card: 15px;     --fw-card: 600;
  --fs-kpi: 28px;      --fw-kpi: 600;
  --fs-rotulo: 12px;   --fw-rotulo: 600;
  --fs-apoio: 13px;
  --fs-base: 14px;

  /* Espaço, raio, movimento */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  --dur-rapida: 150ms; --dur: 200ms; --dur-lenta: 250ms;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* Tema ESCURO: preferência do sistema (sem escolha salva) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--rich-black);
    --surface: var(--dark-green);
    --surface-2: color-mix(in srgb, var(--pine) 60%, var(--dark-green));
    --line: var(--pine);
    --line-forte: var(--frog);
    --fg: var(--antiflash);
    --muted: var(--pistachio);
    --muted-2: var(--stone);
    --heading: var(--antiflash);
    --accent: var(--caribbean);
    --accent-text: var(--caribbean);
    --on-accent: var(--rich-black);
    --foco: var(--caribbean);
    --sucesso: var(--caribbean);
    --sucesso-bg: color-mix(in srgb, var(--caribbean) 14%, var(--dark-green));
    --alerta: var(--ambar-escuro);
    --alerta-bg: color-mix(in srgb, var(--ambar-escuro) 14%, var(--dark-green));
  --alerta-fill: var(--ambar-escuro);
  --prev-fill: var(--meadow);
    --critico: var(--coral-escuro);
    --critico-bg: color-mix(in srgb, var(--coral-escuro) 14%, var(--dark-green));
    --neutro-bg: var(--pine);
    --serie-1: var(--caribbean);
    --serie-2: var(--meadow);
    --serie-3: var(--mint);
    --serie-4: var(--frog);
    --serie-5: var(--bangladesh);
    --serie-6: var(--pistachio);
    --placa-borda: var(--stone);
    --sombra-1: none;
    --sombra-2: 0 8px 24px color-mix(in srgb, var(--rich-black) 60%, transparent);
    color-scheme: dark;
  }
}
/* Tema ESCURO: escolha explícita (botão) — mesmos valores */
:root[data-theme="dark"] {
  --bg: var(--rich-black);
  --surface: var(--dark-green);
  --surface-2: color-mix(in srgb, var(--pine) 60%, var(--dark-green));
  --line: var(--pine);
  --line-forte: var(--frog);
  --fg: var(--antiflash);
  --muted: var(--pistachio);
  --muted-2: var(--stone);
  --heading: var(--antiflash);
  --accent: var(--caribbean);
  --accent-text: var(--caribbean);
  --on-accent: var(--rich-black);
  --foco: var(--caribbean);
  --sucesso: var(--caribbean);
  --sucesso-bg: color-mix(in srgb, var(--caribbean) 14%, var(--dark-green));
  --alerta: var(--ambar-escuro);
  --alerta-bg: color-mix(in srgb, var(--ambar-escuro) 14%, var(--dark-green));
  --alerta-fill: var(--ambar-escuro);
  --prev-fill: var(--meadow);
  --critico: var(--coral-escuro);
  --critico-bg: color-mix(in srgb, var(--coral-escuro) 14%, var(--dark-green));
  --neutro-bg: var(--pine);
  --serie-1: var(--caribbean);
  --serie-2: var(--meadow);
  --serie-3: var(--mint);
  --serie-4: var(--frog);
  --serie-5: var(--bangladesh);
  --serie-6: var(--pistachio);
  --placa-borda: var(--stone);
  --sombra-1: none;
  --sombra-2: 0 8px 24px color-mix(in srgb, var(--rich-black) 60%, transparent);
  color-scheme: dark;
}

/* =====================================================================
   BASE
   ===================================================================== */
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: var(--fs-base); line-height: 1.5; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:is(button, a, input, select, textarea):focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.maiusc { text-transform: uppercase; }

/* =====================================================================
   LAYOUT BASE — sidebar fixa no computador, menu deslizante no celular
   ===================================================================== */
:root { --lateral-w: 248px; --topo-h: 60px; --conteudo-max: 1240px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
.app { display: grid; grid-template-columns: var(--lateral-w) minmax(0, 1fr); min-height: 100vh; }

/* Sidebar */
.lateral {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px));
  display: flex; flex-direction: column; gap: var(--s-5);
  background: var(--surface); border-right: 1px solid var(--line);
  padding-block: var(--s-5) var(--s-4);
  padding-left: max(var(--s-4), env(safe-area-inset-left, 0px)); padding-right: var(--s-4);
  overflow-y: auto; z-index: 30;
}
.lateral-marca { display: flex; align-items: center; gap: var(--s-3); padding-inline: var(--s-2); }
.logo { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r-md); background: var(--accent); color: var(--on-accent); }
.logo svg { width: 20px; height: 20px; }
.lateral-nome { min-width: 0; display: grid; }
.lateral-nome h1 { margin: 0; font-size: var(--fs-card); font-weight: 700; letter-spacing: -0.01em; color: var(--heading); line-height: 1.25; }
.lateral-nome span { font-size: 12px; color: var(--muted); }
.lateral-rodape { margin: auto 0 0; padding: var(--s-3) var(--s-2) 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

/* Itens de navegação */
.abas { display: grid; gap: 2px; }
.aba {
  position: relative; display: flex; align-items: center; gap: var(--s-3); width: 100%;
  padding: 9px var(--s-3); border: 0; border-radius: var(--r-md); background: none;
  color: var(--muted); font-weight: 500; text-align: left; cursor: pointer;
  transition: background var(--dur-rapida) var(--ease), color var(--dur-rapida) var(--ease);
}
.aba svg { flex: none; width: 18px; height: 18px; }
.aba .aba-rot { flex: 1; min-width: 0; }
.aba:hover { background: var(--surface-2); color: var(--fg); }
.aba[aria-current="page"] { background: var(--sucesso-bg); color: var(--fg); font-weight: 600; }
.aba[aria-current="page"] svg { color: var(--accent-text); }
.aba[aria-current="page"]::before { content: ""; position: absolute; left: -16px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.aba .cont { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); padding: 1px 7px; border-radius: var(--r-pill); background: var(--surface-2); font-weight: 600; }
.aba[aria-current="page"] .cont { background: var(--surface); color: var(--accent-text); }

/* Coluna de conteúdo e cabeçalho */
.conteudo { min-width: 0; display: flex; flex-direction: column; }
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: var(--s-3); min-height: var(--topo-h);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(140%) blur(8px); backdrop-filter: saturate(140%) blur(8px);
  border-bottom: 1px solid var(--line);
  padding-left: var(--s-6); padding-right: max(var(--s-6), env(safe-area-inset-right, 0px));
}
.trilha { margin: 0; flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-apoio); white-space: nowrap; overflow: hidden; }
.trilha-raiz, .trilha-sep { color: var(--muted); }
.trilha strong { color: var(--fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.icone-btn {
  flex: none; display: inline-grid; place-items: center; width: 36px; height: 36px;
  border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
  transition: background var(--dur-rapida) var(--ease), border-color var(--dur-rapida) var(--ease);
}
.icone-btn:hover { background: var(--surface-2); border-color: var(--line-forte); }
.icone-btn svg { width: 18px; height: 18px; }
.tema-btn[data-tema="dark"] .ico-lua, .tema-btn[data-tema="light"] .ico-sol { display: none; }
.menu-btn { display: none; }

main {
  width: 100%; max-width: var(--conteudo-max); margin: 0 auto;
  padding-block: var(--s-6) 64px;
  padding-left: var(--s-6); padding-right: max(var(--s-6), env(safe-area-inset-right, 0px));
  display: grid; gap: var(--s-5);
}
.veu { position: fixed; inset: 0; z-index: 25; background: color-mix(in srgb, var(--rich-black) 55%, transparent); }

/* Tablet e celular: sidebar vira menu deslizante */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lateral {
    position: fixed; top: 0; bottom: 0; left: 0; height: auto; width: min(84vw, 280px);
    align-self: stretch;   /* sem isto a gaveta fixa encolhe até a altura do conteúdo */
    padding-top: calc(var(--s-5) + env(safe-area-inset-top, 0px));
    padding-bottom: calc(var(--s-4) + env(safe-area-inset-bottom, 0px));
    box-shadow: var(--sombra-2);
    transform: translateX(-100%); visibility: hidden;
    transition: transform var(--dur-lenta) var(--ease), visibility 0s linear var(--dur-lenta);
  }
  .lateral.aberta { transform: none; visibility: visible; transition: transform var(--dur-lenta) var(--ease), visibility 0s; }
  .menu-btn { display: inline-grid; }
  .topo { padding-left: max(var(--s-4), env(safe-area-inset-left, 0px)); padding-right: max(var(--s-4), env(safe-area-inset-right, 0px)); }
  main { padding-block: var(--s-5) 48px; padding-left: max(var(--s-4), env(safe-area-inset-left, 0px)); padding-right: max(var(--s-4), env(safe-area-inset-right, 0px)); gap: var(--s-4); }
}
@media (max-width: 560px) { .trilha-raiz, .trilha-sep { display: none; } }

#tela { display: grid; gap: var(--s-4); }
main > *, #tela > * { min-width: 0; }   /* tabelas largas rolam dentro do cartão, não a página */
.aviso { border-radius: var(--r-md); padding: var(--s-3) var(--s-4); border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: var(--fs-apoio); }
.aviso.bad { background: var(--critico-bg); border-color: transparent; color: var(--fg); }
.aviso.warn { background: var(--alerta-bg); border-color: transparent; color: var(--fg); }

.cab { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: var(--s-3); }
.cab h2 { margin: 0; font-size: var(--fs-titulo); font-weight: var(--fw-titulo); letter-spacing: -0.015em; text-wrap: balance; color: var(--heading); }
.cab p { margin: var(--s-1) 0 0; color: var(--muted); max-width: 70ch; font-size: var(--fs-apoio); }
.ferr { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }

/* Botões */
.btn { border: 1px solid var(--line-forte); background: var(--surface); border-radius: var(--r-sm); padding: 7px var(--s-3); cursor: pointer; font-weight: 500; white-space: nowrap; transition: background var(--dur-rapida) var(--ease), border-color var(--dur-rapida) var(--ease); }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn.pri:hover { background: color-mix(in srgb, var(--accent) 88%, var(--fg)); }
.btn.perigo { color: var(--critico); border-color: var(--critico); }
.btn.mini { padding: 3px 10px; font-size: var(--fs-apoio); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Campos */
input[type="search"], input[type="text"], input[type="number"], input[type="date"], select, textarea {
  background: var(--surface); border: 1px solid var(--line-forte); border-radius: var(--r-sm); padding: 7px 10px; min-width: 0; max-width: 100%;
  transition: border-color var(--dur-rapida) var(--ease);
}
:is(input, select, textarea):hover { border-color: var(--fg); }
input[readonly] { background: var(--surface-2); }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
input[type="search"] { width: 220px; }
textarea { resize: vertical; min-height: 60px; }

.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sombra-1); }

/* Formulário */
.form { padding: var(--s-5); display: grid; gap: var(--s-4); border-color: var(--accent); }
.form h3 { margin: 0; font-size: var(--fs-card); font-weight: var(--fw-card); color: var(--heading); }
.campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: var(--s-3) var(--s-4); }
.campo { display: grid; gap: var(--s-1); align-content: start; min-width: 0; }
.campo label { font-size: var(--fs-rotulo); font-weight: var(--fw-rotulo); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.campo .req { color: var(--critico); }
.campo .ajuda { font-size: 12px; color: var(--muted); }
.campo .erro { font-size: 12px; color: var(--critico); font-weight: 600; }
.campo.invalido :is(input, select) { border-color: var(--critico); }
.campo.check { grid-template-columns: auto 1fr; align-items: center; gap: var(--s-2); }
.campo.check label { text-transform: none; letter-spacing: 0; font-size: var(--fs-base); color: var(--fg); font-weight: 500; }
.acoes { display: flex; flex-wrap: wrap; gap: var(--s-2); }

/* Tabelas */
.tab-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: var(--fs-rotulo); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: var(--fw-rotulo); padding: 10px var(--s-3); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px var(--s-3); border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; }
td.wrap { white-space: normal; min-width: 180px; }
tr.confirmar td { background: var(--critico-bg); }
.confirma { display: inline-flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }
.acoes-linha { display: inline-flex; gap: 6px; }
.rodape-tab { padding: 10px var(--s-3); color: var(--muted); font-size: var(--fs-apoio); border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.vazio { padding: var(--s-6) var(--s-4); text-align: center; color: var(--muted); }
.vazio strong { display: block; color: var(--fg); font-size: var(--fs-card); margin-bottom: var(--s-1); }

/* Placa Mercosul */
.placa { display: inline-block; font-family: var(--font-mono); font-weight: 600; font-size: 12.5px; letter-spacing: .06em; background: var(--placa-fundo); color: var(--placa-texto); border: 1px solid var(--placa-borda); border-top: 4px solid var(--placa-azul); border-radius: 3px; padding: 0 6px 1px; line-height: 1.35; }

/* Etiquetas de status */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px var(--s-2); border-radius: var(--r-pill); background: var(--neutro-bg); color: var(--muted); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--sucesso-bg); color: var(--sucesso); }
.chip.warn { background: var(--alerta-bg); color: var(--alerta); }
.chip.bad { background: var(--critico-bg); color: var(--critico); }
.chip.neutro::before { display: none; }

/* Painel */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 176px), 1fr)); gap: var(--s-3); }
.kpi { padding: var(--s-4); display: grid; gap: 2px; align-content: start; min-width: 0; }
.kpi .rot { font-size: var(--fs-rotulo); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: var(--fw-rotulo); }
.kpi .val { font-size: var(--fs-kpi); font-weight: var(--fw-kpi); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; color: var(--fg); }
.kpi .det { font-size: var(--fs-apoio); color: var(--muted); font-variant-numeric: tabular-nums; }
.duas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: var(--s-3); }
.bloco { padding: var(--s-4) var(--s-5) var(--s-5); display: grid; gap: var(--s-3); align-content: start; min-width: 0; }
.bloco h3 { margin: 0; font-size: var(--fs-card); font-weight: var(--fw-card); color: var(--heading); }
.nota { margin: 0; color: var(--muted); font-size: var(--fs-apoio); }
.lista-atencao { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s-3); }
.lista-atencao li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.lista-atencao .txt { min-width: 0; }
.lista-atencao .txt small { display: block; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; font-size: var(--fs-apoio); }
.barras { display: grid; gap: var(--s-3); }
.barra-lin { display: grid; gap: var(--s-1); }
.barra-lin .topo-b { display: flex; justify-content: space-between; gap: var(--s-2); font-size: var(--fs-apoio); }
.barra-lin .topo-b b { font-variant-numeric: tabular-nums; font-weight: 600; }
.trilho { height: 14px; background: var(--surface-2); border-radius: var(--r-pill); display: flex; overflow: hidden; }
.seg-prev { background: var(--prev-fill); }
.seg-corr { background: var(--alerta); }
.legenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--s-4) + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px var(--s-4); border-radius: var(--r-md); font-weight: 500; z-index: 20; max-width: calc(100% - 32px); box-shadow: var(--sombra-2); }

@media (max-width: 560px) {
  input[type="search"] { width: 100%; }
  .ferr { width: 100%; }
  .kpi .val { font-size: 24px; }
}
/* =====================================================================
   COMPONENTES (etapa 4)
   ===================================================================== */
/* Controles com a mesma altura */
.btn, input[type="search"], input[type="text"], input[type="number"], input[type="date"], select { min-height: 36px; }
.btn.mini { min-height: 30px; }
.btn.fantasma { border-color: transparent; background: transparent; color: var(--muted); }
.btn.fantasma:hover { background: var(--surface-2); color: var(--fg); }
.btn.fantasma.perigo:hover { background: var(--critico-bg); color: var(--critico); }

/* Busca com ícone */
.busca { position: relative; display: inline-flex; align-items: center; }
.busca svg { position: absolute; left: 10px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.busca input { padding-left: 32px; }

/* KPI */
.kpi { gap: var(--s-1); }
.kpi .val { line-height: 1.15; margin-top: 2px; }
.var { display: inline-flex; align-items: center; gap: 4px; width: fit-content; font-size: 12px; font-weight: 600; padding: 2px var(--s-2); border-radius: var(--r-pill); font-variant-numeric: tabular-nums; }
.var svg { width: 12px; height: 12px; }
.var.ruim { color: var(--alerta); background: var(--alerta-bg); }
.var.boa { color: var(--sucesso); background: var(--sucesso-bg); }
.var.neutra { color: var(--muted); background: var(--neutro-bg); }

/* Gráfico de barras: grade discreta, escala e tooltip */
.barras-area { position: relative; display: grid; gap: var(--s-3); }
.barra-lin { border-radius: var(--r-sm); outline-offset: 4px; }
.barra-lin:focus-visible { outline: 2px solid var(--foco); }
.trilho { background-color: var(--surface-2); background-image: repeating-linear-gradient(to right, transparent 0 calc(25% - 1px), color-mix(in srgb, var(--line) 80%, transparent) calc(25% - 1px) 25%); }
.seg-corr { background: var(--alerta-fill); }
.trilho > div { transition: filter var(--dur-rapida) var(--ease); }
.barra-lin:hover .trilho > div, .barra-lin:focus-visible .trilho > div { filter: brightness(1.08); }
.escala { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tip { position: absolute; z-index: 5; pointer-events: none; min-width: 180px; display: grid; gap: 3px; padding: var(--s-2) var(--s-3); border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line-forte); box-shadow: var(--sombra-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.tip strong { font-size: var(--fs-apoio); }
.tip .l { display: flex; justify-content: space-between; gap: var(--s-3); color: var(--muted); }
.tip .l b { color: var(--fg); font-weight: 600; }
.tip .l i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* Tabelas: zebra suave, hover e cabeçalho fixo nas listas */
td { transition: background var(--dur-rapida) var(--ease); }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 50%, var(--surface)); }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.confirmar td { background: var(--critico-bg); }
#tab-box .tab-wrap { max-height: min(70vh, 720px); overflow: auto; border-radius: var(--r-lg) var(--r-lg) 0 0; }
#tab-box thead th { position: sticky; top: 0; z-index: 1; background: var(--surface); box-shadow: inset 0 -1px 0 var(--line); border-bottom: 0; }

/* Estados: carregando (skeleton), vazio e erro */
.esq { display: block; border-radius: var(--r-sm); background: linear-gradient(90deg, var(--surface-2) 0%, color-mix(in srgb, var(--surface-2) 35%, var(--surface)) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: brilho 1.4s linear infinite; }
.esq.t { height: 12px; width: 45%; }
.esq.v { height: 28px; width: 70%; margin: 6px 0 4px; }
.esq.d { height: 12px; width: 60%; }
.esq.l { height: 14px; width: 100%; }
.esq-bloco { min-height: 220px; padding: var(--s-5); display: grid; gap: var(--s-3); align-content: start; }
@keyframes brilho { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.estado { display: grid; justify-items: center; gap: var(--s-2); padding: var(--s-6) var(--s-4); text-align: center; color: var(--muted); }
.estado-ico { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r-pill); background: var(--neutro-bg); color: var(--muted); }
.estado-ico svg { width: 22px; height: 22px; }
.estado.erro .estado-ico { background: var(--critico-bg); color: var(--critico); }
.estado.ok .estado-ico { background: var(--sucesso-bg); color: var(--sucesso); }
.estado strong { color: var(--fg); font-size: var(--fs-card); font-weight: 600; }
.estado p { margin: 0; max-width: 46ch; font-size: var(--fs-apoio); }
.estado .btn { margin-top: var(--s-2); }

/* Formulário em painel lateral */
#form-box:empty { display: none; }
#form-box { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; }
.painel-fundo { position: absolute; inset: 0; background: color-mix(in srgb, var(--rich-black) 55%, transparent); }
#form-box .form {
  position: relative; width: min(500px, 100%); height: 100%; overflow-y: auto;
  border: 0; border-left: 1px solid var(--line); border-radius: 0; box-shadow: var(--sombra-2);
  align-content: start; gap: var(--s-5);
  padding: calc(var(--s-5) + env(safe-area-inset-top, 0px)) max(var(--s-5), env(safe-area-inset-right, 0px)) 0 var(--s-5);
}
.form-topo { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.form-topo h3 { font-size: 18px; font-weight: 700; }
#form-box .acoes { position: sticky; bottom: 0; margin-inline: calc(-1 * var(--s-5)); padding: var(--s-4) var(--s-5) calc(var(--s-4) + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
html.com-painel { overflow: hidden; }

/* Toast */
.toast { display: flex; align-items: center; gap: var(--s-2); }

/* Movimento: entrada suave (desligado com "reduzir movimento") */
@keyframes sobe { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes desliza { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: no-preference) {
  .entra { animation: sobe var(--dur-lenta) var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
  .painel-fundo { animation: fade var(--dur) var(--ease); }
  #form-box .form { animation: desliza var(--dur-lenta) var(--ease); }
  .toast:not([hidden]) { animation: fade var(--dur) var(--ease); }
}
@media (max-width: 560px) {
  .busca { width: 100%; }
  #form-box .form { width: 100%; border-left: 0; }
}

/* =====================================================================
   APLICAÇÃO NAS TELAS (etapa 5)
   ===================================================================== */
#avisos:empty { display: none; }
.lateral-rodape { display: grid; gap: var(--s-2); }
.lateral-rodape p { margin: 0; }
.aviso-local { padding: var(--s-2) var(--s-3); border-radius: var(--r-md); background: var(--surface-2); color: var(--fg); line-height: 1.45; }
.cab p strong { color: var(--fg); font-weight: 600; }
.kpi .rot { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.painel-grade { align-items: start; }
.coluna { display: grid; gap: var(--s-3); align-content: start; min-width: 0; }
.filtros { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; margin-top: calc(-1 * var(--s-2)); }
td { padding-block: var(--s-2); }
.rodape-tab { display: flex; justify-content: space-between; gap: var(--s-3); }
@media (max-width: 560px) {
  .filtros select { flex: 1; }
  .cab .ferr .btn.pri { flex: 1; }
}

/* =====================================================================
   VISUAL PREMIUM — etapa 1: fundo, sidebar flutuante, cabeçalho
   ===================================================================== */
:root {
  --r-lg: 18px; --r-xl: 22px;
  --glow-a: color-mix(in srgb, var(--meadow) 16%, transparent);
  --glow-b: color-mix(in srgb, var(--pistachio) 34%, transparent);
  --grade-linha: color-mix(in srgb, var(--pistachio) 20%, transparent);
  --borda-luz: color-mix(in srgb, var(--meadow) 55%, var(--pistachio));
  --cartao-topo: color-mix(in srgb, var(--meadow) 6%, var(--branco));
  --brilho-pri: 0 6px 18px -8px color-mix(in srgb, var(--bangladesh) 55%, transparent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --glow-a: color-mix(in srgb, var(--caribbean) 11%, transparent);
    --glow-b: color-mix(in srgb, var(--bangladesh) 38%, transparent);
    --grade-linha: color-mix(in srgb, var(--pine) 75%, transparent);
    --borda-luz: color-mix(in srgb, var(--caribbean) 42%, var(--pine));
    --cartao-topo: color-mix(in srgb, var(--forest) 40%, var(--dark-green));
    --brilho-pri: 0 0 22px -4px color-mix(in srgb, var(--caribbean) 55%, transparent);
  }
}
:root[data-theme="dark"] {
  --glow-a: color-mix(in srgb, var(--caribbean) 11%, transparent);
  --glow-b: color-mix(in srgb, var(--bangladesh) 38%, transparent);
  --grade-linha: color-mix(in srgb, var(--pine) 75%, transparent);
  --borda-luz: color-mix(in srgb, var(--caribbean) 42%, var(--pine));
  --cartao-topo: color-mix(in srgb, var(--forest) 40%, var(--dark-green));
  --brilho-pri: 0 0 22px -4px color-mix(in srgb, var(--caribbean) 55%, transparent);
}

/* Fundo: dois brilhos suaves + grade fina (só degradês, sem imagem e sem blur) */
body { background-color: var(--bg); }
/* Camada fixa própria: ao rolar a página, o fundo não é repintado (mais leve que background-attachment: fixed) */
.app::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  /* degradê verde contínuo (sem grade) + dois brilhos suaves */
  background-image:
    radial-gradient(900px 560px at 88% -10%, var(--glow-a), transparent 70%),
    radial-gradient(800px 640px at -8% 108%, var(--glow-b), transparent 70%),
    var(--fundo-grad);
}
:root { --fundo-grad: linear-gradient(160deg, color-mix(in srgb, var(--meadow) 14%, var(--antiflash)) 0%, var(--antiflash) 50%, color-mix(in srgb, var(--pistachio) 35%, var(--antiflash)) 100%); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --fundo-grad: linear-gradient(160deg, color-mix(in srgb, var(--bangladesh) 45%, var(--rich-black)) 0%, var(--rich-black) 50%, color-mix(in srgb, var(--forest) 45%, var(--rich-black)) 100%); }
}
:root[data-theme="dark"] { --fundo-grad: linear-gradient(160deg, color-mix(in srgb, var(--bangladesh) 45%, var(--rich-black)) 0%, var(--rich-black) 50%, color-mix(in srgb, var(--forest) 45%, var(--rich-black)) 100%); }

/* Cartões: borda com reflexo de luz e topo levemente iluminado */
.cartao {
  border: 1px solid transparent;
  background:
    linear-gradient(180deg, var(--cartao-topo), var(--surface) 160px) padding-box,
    linear-gradient(155deg, var(--borda-luz), var(--line) 36%, var(--line) 72%, color-mix(in srgb, var(--borda-luz) 35%, var(--line))) border-box;
}
#tab-box thead th { background: var(--cartao-topo); }

/* Botões em pílula */
.btn { border-radius: var(--r-pill); padding-inline: var(--s-4); }
.btn.mini { padding-inline: var(--s-3); }
.btn.pri { box-shadow: var(--brilho-pri); }
.btn.pilula { display: inline-flex; align-items: center; gap: 6px; }
.btn.pilula svg { width: 16px; height: 16px; flex: none; }
.icone-btn { border-radius: var(--r-pill); }
.busca input, .busca-global input { border-radius: var(--r-pill); }

/* Sidebar flutuante (computador) */
@media (min-width: 901px) {
  :root { --lateral-w: 284px; }
  .lateral {
    top: calc(var(--s-3) + env(safe-area-inset-top, 0px));
    margin: var(--s-3) 0 var(--s-3) max(var(--s-3), env(safe-area-inset-left, 0px));
    height: calc(100vh - 24px - env(safe-area-inset-top, 0px));
    border: 1px solid transparent; border-radius: var(--r-xl);
    background:
      linear-gradient(180deg, var(--cartao-topo), var(--surface) 240px) padding-box,
      linear-gradient(170deg, var(--borda-luz), var(--line) 30%, var(--line)) border-box;
    box-shadow: var(--sombra-2);
    padding: var(--s-4);
  }
  .aba[aria-current="page"]::before { left: calc(-1 * var(--s-4)); }
}
.lateral { gap: var(--s-4); }

/* Perfil */
.perfil { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2); border-radius: var(--r-md); }
.avatar {
  flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%;
  font-weight: 700; font-size: 14px; letter-spacing: .02em; color: var(--on-accent);
  background: linear-gradient(135deg, var(--caribbean), var(--mint));
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px color-mix(in srgb, var(--accent) 45%, transparent);
}
.perfil-txt { display: grid; min-width: 0; line-height: 1.3; }
.perfil-txt strong { font-size: var(--fs-base); color: var(--fg); line-height: 1.25; text-wrap: balance; }
.perfil-txt span { font-size: 12px; color: var(--muted); }
.selo { margin-left: auto; flex: none; font-size: 11px; font-weight: 700; padding: 2px var(--s-2); border-radius: var(--r-pill); background: var(--sucesso-bg); color: var(--sucesso); }
.nav-titulo { margin: var(--s-2) 0 calc(-1 * var(--s-2)); padding: 0 var(--s-3); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Item ativo com brilho */
.aba[aria-current="page"] { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 18%, transparent), color-mix(in srgb, var(--accent) 3%, transparent)); }

/* Rodapé da sidebar: cartão do Power BI */
.lateral-rodape { border-top: 0; padding: 0; }
.cta-bi {
  display: grid; gap: var(--s-2); padding: var(--s-4); border-radius: var(--r-lg);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
  background: radial-gradient(130% 120% at 100% 0%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 60%), var(--surface-2);
}
.cta-ico { display: grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-md); background: var(--accent); color: var(--on-accent); }
.cta-ico svg { width: 18px; height: 18px; }
.cta-bi strong { font-size: var(--fs-base); color: var(--fg); }
.cta-bi p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
.cta-bi .btn { justify-content: center; margin-top: var(--s-1); }
.lateral-fic { font-size: 12px; color: var(--muted); padding: 0 var(--s-2); }

/* Cabeçalho */
.topo { gap: var(--s-3); background: color-mix(in srgb, var(--bg) 94%, transparent); border-bottom-color: color-mix(in srgb, var(--line) 70%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.topo-marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topo-marca .logo { width: 32px; height: 32px; border-radius: var(--r-md); }
.topo-marca .logo svg { width: 18px; height: 18px; }
.topo-nome { margin: 0; font-size: var(--fs-card); font-weight: 700; color: var(--heading); white-space: nowrap; }
.topo-sep { color: var(--muted); }
.topo-tela { font-size: var(--fs-apoio); font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lancar { position: relative; }
.menu-lancar {
  position: absolute; top: calc(100% + var(--s-2)); left: 0; z-index: 35; min-width: 260px; padding: 6px;
  display: grid; gap: 2px; border-radius: var(--r-md); background: var(--surface);
  border: 1px solid var(--line-forte); box-shadow: var(--sombra-2);
}
.menu-lancar button {
  display: grid; grid-template-columns: auto 1fr; gap: 2px var(--s-3); align-items: center; width: 100%;
  padding: 9px 10px; border: 0; border-radius: var(--r-sm); background: none; text-align: left; cursor: pointer; color: var(--fg);
}
.menu-lancar button:hover, .menu-lancar button:focus-visible { background: var(--surface-2); outline-offset: -2px; }
.menu-lancar svg { grid-row: span 2; width: 20px; height: 20px; color: var(--accent-text); }
.menu-lancar strong { font-weight: 600; font-size: var(--fs-base); }
.menu-lancar small { font-size: 12px; color: var(--muted); }
.topo-dir { margin-left: auto; display: flex; align-items: center; gap: var(--s-2); }
.busca-global { position: relative; display: flex; align-items: center; margin: 0; }
.busca-global svg { position: absolute; left: 12px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.busca-global input { width: 260px; padding-left: 36px; background: var(--surface); }
.sino { position: relative; }
.badge {
  position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px;
  display: grid; place-items: center; border-radius: var(--r-pill); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 2px var(--bg);
}
@media (max-width: 1100px) { .busca-global input { width: 200px; } .topo-sep, .topo-tela { display: none; } }
@media (max-width: 760px) {
  .busca-global, .topo-nome { display: none; }
  .topo-tela { display: inline; color: var(--fg); }
  .lancar-rot { display: none; }
  .lancar .btn.pilula { padding-inline: 10px; }
}

/* =====================================================================
   VISUAL PREMIUM — etapa 2: KPIs com gráfico de área e cor pela tendência
   ===================================================================== */
:root { --tend-boa: var(--frog); --tend-ruim: var(--coral-claro); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tend-boa: var(--caribbean); --tend-ruim: var(--coral-escuro); } }
:root[data-theme="dark"] { --tend-boa: var(--caribbean); --tend-ruim: var(--coral-escuro); }

.kpi { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: var(--s-1); --tend: var(--muted-2); }
.kpi > * { position: relative; z-index: 1; }
.kpi.tend-boa { --tend: var(--tend-boa); --borda-luz: color-mix(in srgb, var(--tend-boa) 60%, var(--line)); }
.kpi.tend-ruim { --tend: var(--tend-ruim); --borda-luz: color-mix(in srgb, var(--tend-ruim) 60%, var(--line)); }
/* brilho na base do cartão, na cor da tendência */
.kpi::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 75%; z-index: 0; pointer-events: none;
  background: radial-gradient(90% 85% at 50% 115%, color-mix(in srgb, var(--tend) 20%, transparent), transparent 70%);
}
.kpi { container-type: inline-size; }
/* O número só encolhe se não couber: o tamanho considera a largura do cartão e quantos caracteres ele tem (--n) */
.kpi .val { font-size: clamp(20px, calc(160cqi / var(--n, 6)), 30px); white-space: nowrap; overflow-wrap: normal; }

.spark { position: relative; height: 76px; margin: auto calc(-1 * var(--s-4)) calc(-1 * var(--s-4)); cursor: crosshair; touch-action: pan-y; flex: none; }
.kpi .det { margin-bottom: var(--s-3); }
.spark svg { display: block; width: 100%; height: 100%; overflow: visible; }
.spark-stop { stop-color: var(--tend); }
.spark-linha { fill: none; stroke: var(--tend); stroke-width: 2.25; stroke-linecap: round; filter: drop-shadow(0 0 5px color-mix(in srgb, var(--tend) 65%, transparent)); }
.spark-ponto {
  position: absolute; width: 11px; height: 11px; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
  background: var(--surface); border: 2px solid var(--tend); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tend) 22%, transparent);
}
.spark-balao {
  position: absolute; transform: translate(-50%, calc(-100% - 10px)); pointer-events: none; white-space: nowrap;

    ENT[S.form.ent].campos.forEach((c) => { if (c.so) form.querySelector('[data-campo="' + c.k + '"]').hidden = !c.so(form); });
  }

  function montarForm(box, n, id) {
    const E = ENT[n];
    const atual = id ? S.dados[n].find((r) => r.id === id) : null;
    if (id && !atual) { fecharForm(); return; }
    const form = h("form", { class: "cartao form", novalidate: true, role: "dialog", "aria-modal": "true", "aria-labelledby": "form-titulo" });
    form.append(h("div", { class: "form-topo" },
      h("h3", { id: "form-titulo", text: atual ? "Editar " + E.nome : E.novo }),
      h("button", { class: "icone-btn", type: "button", "aria-label": "Fechar sem salvar", onclick: fecharFormERedesenhar }, icone("fechar"))));
    const grade = h("div", { class: "campos" });
    E.campos.forEach((c) => {
      const idc = "f-" + n + "-" + c.k;
      let el;
      if (c.t === "select") {
        el = h("select", { id: idc, name: c.k });
      } else if (c.t === "check") {
        el = h("input", { id: idc, name: c.k, type: "checkbox" });
      } else {
        el = h("input", { id: idc, name: c.k, type: c.t, min: c.min, max: c.max, step: c.step, inputmode: c.t === "number" ? "decimal" : null,
          readonly: c.somenteLeitura ? true : null, list: c.lista ? idc + "-l" : null, autocomplete: "off",
          disabled: atual && c.fixoNaEdicao ? true : null, class: c.maiusc ? "maiusc" : null });
      }
      const wrap = c.t === "check"
        ? h("div", { class: "campo check", "data-campo": c.k }, el, h("label", { for: idc, text: c.l }))
        : h("div", { class: "campo", "data-campo": c.k },
            h("label", { for: idc }, c.l, c.req ? h("span", { class: "req", text: " *" }) : null),
            el,
            c.lista ? h("datalist", { id: idc + "-l" }, c.lista.map((x) => h("option", { value: x }))) : null,
            c.ajuda ? h("span", { class: "ajuda", text: c.ajuda }) : null,
            h("span", { class: "erro", hidden: true }));
      grade.append(wrap);
    });
    form.append(grade);
    const btnSalvar = h("button", { class: "btn pri", type: "submit" }, atual ? "Salvar alterações" : "Lançar");
    form.append(h("div", { class: "acoes" }, btnSalvar, h("button", { class: "btn", type: "button", onclick: fecharFormERedesenhar }, "Cancelar")));
    box.replaceChildren(h("div", { class: "painel-fundo", "aria-hidden": "true", onclick: fecharFormERedesenhar }), form);
    document.documentElement.classList.add("com-painel");

    // valores iniciais
    E.campos.forEach((c) => { if (c.t === "select") atualizarOpcoes(form, c.k); });
    E.campos.forEach((c) => {
      const el = form[c.k];
      let v = atual ? atual[c.k] : undefined;
      if (v === undefined) {
        if (c.t === "date") v = hoje();
        else if (n === "multas" && c.k === "status") v = "Pendente";
        else if (c.k === "status" && n === "veiculos") v = "Ativo";
        else if (c.k === "status" && n === "motoristas") v = "Ativo";
        else if (c.k === "turno") v = "Manhã";
      }
      if (c.t === "check") el.checked = !!v;
      else el.value = v == null ? "" : String(v);
    });
    if (E.aoMudar && !atual) E.aoMudar(form, "infracao");
    if (n === "ocorrencias") { atualizarOpcoes(form, "motivo"); if (atual) form.motivo.value = atual.motivo || ""; }
    mostrarCondicionais(form);
    form.addEventListener("change", (e) => { if (E.aoMudar && e.target.name) E.aoMudar(form, e.target.name); });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const dados = coletar(form, n, atual);
      if (!dados) return;
      btnSalvar.disabled = true;
      try {
        await salvar(n, atual ? atual.id : null, dados, atual);
        toast(E.salvo);
        fecharForm();
        desenharTabela(n);
      } catch (err) {
        btnSalvar.disabled = false;
        mostrarErroGravacao(form, err);
      }
    });
  }

  function coletar(form, n, atual) {
    const E = ENT[n], dados = {}, erros = {};
    E.campos.forEach((c) => {
      const el = form[c.k];
      const vis = !c.so || c.so(form);
      if (c.t === "check") { dados[c.k] = el.checked; return; }
      let v = el.value.trim();
      if (c.maiusc) v = v.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (!vis) { dados[c.k] = null; return; }
      if (c.t === "number") {
        if (v === "") { if (c.req) erros[c.k] = "Campo obrigatório."; dados[c.k] = null; return; }
        const x = Number(v.replace(",", "."));
        if (!isFinite(x)) { erros[c.k] = "Digite um número."; return; }
        if (c.inteiro && !Number.isInteger(x)) erros[c.k] = "Use um número inteiro.";
        if (c.min != null && x < c.min) erros[c.k] = "Mínimo " + nf0.format(c.min) + ".";
        if (c.max != null && x > c.max) erros[c.k] = "Máximo " + nf0.format(c.max) + ".";
        dados[c.k] = Math.round(x * 100) / 100; return;
      }
      if (c.req && !v) { erros[c.k] = "Campo obrigatório."; return; }
      if (c.padrao && v && !c.padrao.test(v)) erros[c.k] = c.msgPadrao;
      dados[c.k] = v || null;
    });
    if (atual && E.idPorCampo) dados[E.idPorCampo] = atual[E.idPorCampo];
    if (n === "multas" && !dados.motoristaId) dados.motoristaId = null;
    Object.assign(erros, E.validar ? E.validar(dados, atual && atual.id) : {});
    form.querySelectorAll(".campo").forEach((w) => { w.classList.remove("invalido"); const s = w.querySelector(".erro"); if (s) { s.hidden = true; s.textContent = ""; } });
    const ks = Object.keys(erros);
    ks.forEach((k) => {
      const w = form.querySelector('[data-campo="' + k + '"]');
      if (!w) return;
      w.classList.add("invalido");
      const s = w.querySelector(".erro"); if (s) { s.textContent = erros[k]; s.hidden = false; }
    });
    if (ks.length) { const el = form[ks[0]]; if (el && el.focus) el.focus(); return null; }
    return dados;
  }

  async function salvar(n, id, dados, atual) {
    const col = S.db.collection(n);
    const corpo = Object.assign({}, dados, { atualizadoEm: agoraISO(), criadoEm: (atual && atual.criadoEm) || agoraISO() });
    const ref = id ? col.doc(id) : ENT[n].idPorCampo ? col.doc(dados[ENT[n].idPorCampo]) : col.doc();
    await ref.set(corpo);
  }

  async function excluir(n, id) {
    try {
      await S.db.collection(n).doc(id).delete();
      S.confirmar = null;
      toast("Registro excluído");
      desenharTabela(n);
    } catch (err) {
      S.confirmar = null; desenharTabela(n);
      toast(mensagemErro(err));
    }
  }

  function mensagemErro(err) {
    const c = err && err.code;
    if (c === "invalid_argument") { S.podeEscrever = false; desenharAvisos(); return "Sua conta não tem permissão para alterar os dados."; }
    if (c === "quota_exceeded") return "O banco atingiu o limite de registros. Exclua registros antigos para lançar novos.";
    if (c === "resource_exhausted") return "Muitas gravações seguidas. Aguarde alguns segundos e tente de novo.";
    return "Não foi possível gravar agora. Verifique a conexão e tente de novo.";
  }
  function mostrarErroGravacao(form, err) {
    let p = form.querySelector(".aviso");
    if (!p) { p = h("div", { class: "aviso bad" }); form.insertBefore(p, form.querySelector(".acoes")); }
    p.textContent = mensagemErro(err);
  }

  // ---------- Exportar CSV (mesmas colunas da pasta data/raw do projeto)
  // todas = true ignora os filtros da tela (usado pelo "Exportar tudo" da sidebar)
  async function exportarCSV(n, todas) {
    const E = ENT[n];
    const esc = (v) => { if (v == null) return ""; const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const linhas = [E.csv.map((c) => c[0]).join(",")].concat(linhasFiltradas(n, todas).map((r) => E.csv.map(([, g]) => esc(typeof g === "function" ? g(r) : r[g])).join(",")));
    try {
      await S.downloads.save({ filename: n + ".csv", data: linhas.join("\n") + "\n", request: "Baixar " + E.titulo + " em CSV" });
      if (!todas) toast("Arquivo " + n + ".csv pronto");
      return true;
    } catch (err) {
      if (err && err.code === "declined") return false;
      toast("Não foi possível gerar o arquivo agora.");
      return false;
    }
  }
  async function exportarTudo() {
    const btn = document.getElementById("exportar-tudo");
    btn.disabled = true;
    let ok = 0;
    for (const n of Object.keys(ENT)) { if (await exportarCSV(n, true)) ok++; }
    btn.disabled = false;
    toast(ok ? ok + " arquivo" + (ok > 1 ? "s" : "") + " CSV exportado" + (ok > 1 ? "s" : "") : "Nenhum arquivo exportado");
  }

  // ---------------------------------------------------------------- cabeçalho: lançar, busca e alertas
  const OPCOES_LANCAR = [
    ["manutencoes", "Manutenção", "Entrada de caminhão na oficina"],
    ["multas", "Multa", "Auto de infração"],
    ["ocorrencias", "Falta ou atraso", "Ocorrência de ponto"],
  ];
  function iniciarCabecalho() {
    const btn = document.getElementById("lancar-btn"), menu = document.getElementById("lancar-menu");
    menu.replaceChildren(...OPCOES_LANCAR.map(([n, rot, dica]) =>
      h("button", { type: "button", role: "menuitem", "data-ent": n, onclick: () => escolherLancamento(n) }, icone(n), h("strong", { text: rot }), h("small", { text: dica }))));
    const itens = () => Array.from(menu.querySelectorAll("[role=menuitem]"));
    const abrir = () => { menu.hidden = false; btn.setAttribute("aria-expanded", "true"); itens()[0].focus(); };
    const fechar = (voltar) => { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); if (voltar) btn.focus(); };
    btn.addEventListener("click", () => (menu.hidden ? abrir() : fechar(true)));
    menu.addEventListener("keydown", (e) => {
      const lista = itens(), i = lista.indexOf(document.activeElement);
      if (e.key === "ArrowDown") { e.preventDefault(); lista[(i + 1) % lista.length].focus(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); lista[(i - 1 + lista.length) % lista.length].focus(); }
      else if (e.key === "Escape") { e.preventDefault(); fechar(true); }
      else if (e.key === "Tab") fechar(false);
    });
    document.addEventListener("click", (e) => { if (!menu.hidden && !document.getElementById("lancar").contains(e.target)) fechar(false); });
    function escolherLancamento(n) {
      fechar(false);
      irPara(n);
      btn.focus();               // ao fechar o formulário, o foco volta para "Lançar"
      abrirForm(n, null);
    }

    // Busca: numa lista, filtra a própria lista; no painel, placa vai para Caminhões e nome para Motoristas
    document.getElementById("busca-global").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = document.getElementById("busca-global-campo").value.trim();
      const alvo = ENT[S.tela] ? S.tela : /^[A-Za-z]{3}\s?-?\d/.test(q) ? "veiculos" : "motoristas";
      S.filtros[alvo] = Object.assign({ mes: "" }, S.filtros[alvo], { busca: q });
      irPara(alvo);
      if (S.tela === alvo) desenharTela();
    });

    document.getElementById("sino").addEventListener("click", () => {
      irPara("painel");
      const alvo = document.getElementById("bloco-alertas");
      if (alvo) {
        alvo.setAttribute("tabindex", "-1");
        alvo.scrollIntoView({ behavior: reduzMovimento() ? "auto" : "smooth", block: "start" });
        alvo.focus({ preventScroll: true });
      }
    });
    document.getElementById("exportar-tudo").addEventListener("click", exportarTudo);
  }
  function desenharSino() {
    const badge = document.getElementById("sino-qtd"), sino = document.getElementById("sino");
    const pronto = ["veiculos", "motoristas", "manutencoes", "multas", "ocorrencias"].every((n) => S.pronto[n]);
    if (!pronto) { badge.hidden = true; return; }
    const m = S.mesPainel || ultimoMes();
    const qtd = alertasDoMes(m).length;
    badge.textContent = nf0.format(qtd); badge.hidden = qtd === 0;
    sino.setAttribute("aria-label", qtd ? qtd + " alerta" + (qtd > 1 ? "s" : "") + " em " + mesNome(m) + ". Ver no painel" : "Nenhum alerta em " + mesNome(m));
  }

  // ---------------------------------------------------------------- dados ao vivo
  function aoChegar(n, snap) {
    S.dados[n] = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
    S.pronto[n] = true;
    desenharAbas();
    // Não reconstrói um formulário aberto: só atualiza tabela ou painel
    // Só redesenha a tabela da tela aberta, para não apagar a busca ou o formulário
    if (S.tela === "painel") desenharTela();
    else if (document.getElementById("tab-box")) desenharTabela(S.tela);
    else desenharTela();
  }

  // ---------------------------------------------------------------- tema claro / escuro
  // Escolha salva > preferência do sistema operacional. Sem escolha salva, acompanha o sistema.
  function iniciarTema() {
    const btn = document.getElementById("tema-btn");
    const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    const atual = () => document.documentElement.getAttribute("data-theme") || (mq && mq.matches ? "dark" : "light");
    const refletir = () => {
      const t = atual();
      btn.dataset.tema = t;
      btn.setAttribute("aria-label", t === "dark" ? "Mudar para o tema claro" : "Mudar para o tema escuro");
    };
    btn.addEventListener("click", () => {
      const novo = atual() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", novo);
      try { localStorage.setItem("frota.tema", novo); } catch (e) {}
      refletir();
    });
    if (mq && mq.addEventListener) mq.addEventListener("change", refletir);
    // O claude.ai também pode trocar o tema da página: acompanha a mudança do atributo
    new MutationObserver(refletir).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    refletir();
  }

  async function iniciar() {
    iniciarTema();
    iniciarMenu();
    iniciarCabecalho();
    let inicial = location.hash.slice(1);
    if (!ORDEM_ABAS.includes(inicial)) { try { inicial = localStorage.getItem("frota.tela") || "painel"; } catch (e) { inicial = "painel"; } }
    S.tela = ORDEM_ABAS.includes(inicial) ? inicial : "painel";
    document.getElementById("topo-tela").textContent = rotuloTela(S.tela);
    desenharAbas(); desenharTela();

    // Fora do claude.ai (arquivo aberto direto no navegador): banco local no localStorage
    if (!(window.claude && window.claude.use)) {
      S.modoLocal = true; S.db = criarBancoLocal(); S.downloads = criarDownloadsLocal(); S.conectado = true;
      desenharAvisos(); assinar(S.db); desenharTela(); return;
    }
    const use = (n) => window.claude.use(n);
    const [db, user, downloads] = await Promise.all([use("db"), use("user"), use("downloads")]);
    S.downloads = downloads;
    if (!db) { S.conectado = false; desenharAvisos(); desenharTela(); return; }
    S.db = db; S.conectado = true;
    if (user) { try { const pode = await user.can("data.write"); if (pode === false) S.podeEscrever = false; } catch (e) {} }
    desenharAvisos();
    assinar(db);
    desenharTela();
  }
  function assinar(db) {
    Object.keys(ENT).forEach((n) => {
      db.collection(n).onSnapshot((snap) => aoChegar(n, snap), () => { S.pronto[n] = true; S.conectado = false; desenharAvisos(); desenharTela(); });
    });
  }

  // ---------------------------------------------------------------- versão local (sem claude.ai)
  function criarBancoLocal() {
    const CHAVE = "frota.dados.v1";
    let dados = null;
    try { dados = JSON.parse(localStorage.getItem(CHAVE) || "null"); } catch (e) { dados = null; }
    // Abrir com "?restaurar" no endereço volta aos dados fictícios originais (apaga os lançamentos de teste)
    let restaurar = false;
    try { restaurar = new URLSearchParams(location.search).has("restaurar"); } catch (e) {}
    if (restaurar) {
      dados = null;
      try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
      setTimeout(() => toast("Dados fictícios originais restaurados"), 400);
    }
    const ouvintes = {};
    const gravar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(dados)); } catch (e) { toast("O navegador não deixou salvar. Verifique o espaço ou o modo anônimo."); } };
    if (!dados) {
      dados = {};
      const ex = window.FROTA_EXEMPLO || {};
      Object.keys(ENT).forEach((c) => { dados[c] = Object.assign({}, ex[c] || {}); });
      gravar();
    }
    const foto = (c) => ({ docs: Object.keys(dados[c] || {}).map((id) => ({ id, data: () => dados[c][id] })) });
    const avisar = (c) => (ouvintes[c] || []).forEach((fn) => fn(foto(c)));
    return {
      collection(c) {
        dados[c] = dados[c] || {};
        return {
          onSnapshot(fn) { (ouvintes[c] = ouvintes[c] || []).push(fn); setTimeout(() => fn(foto(c)), 0); return () => {}; },
          doc(id) {
            const k = id || "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            return {
              id: k,
              set: async (d) => { dados[c][k] = JSON.parse(JSON.stringify(d)); gravar(); avisar(c); },
              delete: async () => { delete dados[c][k]; gravar(); avisar(c); },
            };
          },
        };
      },
    };
  }
  function criarDownloadsLocal() { return {
    save: async ({ filename, data }) => {
      const blob = new Blob(["﻿" + data], { type: "text/csv;charset=utf-8" }); // BOM: acentos certos no Excel
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      return { status: "saved" };
    },
  }; }
  iniciar();
})();
</script>
